[package]
name = "ming-tts-wgpu"
version = "0.1.0"
edition = "2021"

# Library first: in-process consumers depend on this crate; the binary is a
# thin CLI over it. Keep both explicit so the exe name stays stable.
[lib]
name = "ming_tts_wgpu"
path = "src/lib.rs"

[[bin]]
name = "ming-tts-wgpu"
path = "src/main.rs"

[dependencies]
# Vulkan/GL/Metal only. wgpu 30's default `dx12` backend forces
# `windows = 0.62` while `gpu-allocator 0.28` accepts 0.53..=0.62; inside
# VoxTrans (Tauri pins windows 0.61.3) Cargo then picks two different
# `ID3D12Device` types and wgpu-hal fails to compile. This machine runs the
# engine on Vulkan, so dropping the unused DX12 backend fixes the graph
# without changing inference. Keep every other default feature.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "metal", "gles", "vulkan", "wgsl", "webgpu"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
memmap2 = "0.9"
safetensors = "0.4"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rustfft = "6"
hound = "3"
tokenizers = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
# CPU twin backend: low-level primitives only (no NN framework), same as the
# qwen3-asr-wgpu CPU decoder.
rayon = "1.10"
# ONNX Runtime for the CAMPlus speaker encoder (spk.rs). load-dynamic links
# nothing at build time: the runtime is loaded from onnxruntime.dll at run
# time, so the build never downloads a binary. api-23 matches the installed
# ONNX Runtime 1.23 (ORT 1.x exposes API version x).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-23"] }
rustfst = "1.3.1"
fancy-regex = "0.20.0"

[profile.release]
opt-level = 3
lto = "thin"
