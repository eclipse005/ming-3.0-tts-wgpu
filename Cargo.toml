[package]
name = "ming-tts-wgpu"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = "30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
memmap2 = "0.9"
safetensors = "0.4"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rustfft = "6"
hound = "3"
tokenizers = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
# CPU twin backend: low-level primitives only (no NN framework), same as the
# qwen3-asr-wgpu CPU decoder.
rayon = "1.10"
# ONNX Runtime for the CAMPlus speaker encoder (spk.rs). load-dynamic links
# nothing at build time: the runtime is loaded from onnxruntime.dll at run
# time, so the build never downloads a binary. api-23 matches the installed
# ONNX Runtime 1.23 (ORT 1.x exposes API version x).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-23"] }
rustfst = "1.3.1"
fancy-regex = "0.20.0"

[profile.release]
opt-level = 3
lto = "thin"
